<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>マトリク君</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>

<!-- ============ 選択画面 ============ -->
<div id="selectScreen">
  <div class="select-card">
    <h1>コラボレーターを選ぶ</h1>
    <p class="lead">表に載せる人だけチェックしてください</p>
    <div class="select-actions">
      <button id="selectAllBtn">すべて選択</button>
      <button id="selectNoneBtn">すべて解除</button>
    </div>
    <ul id="personList"></ul>
    <button class="go-btn" id="goBtn">この人たちで表を作る</button>
  </div>
</div>

<!-- ============ メイン画面 ============ -->
<div id="mainScreen">
  <header>
    <div class="title-row">
      <h1 class="main-title">マトリク君<span class="accent">○</span>(コラボ歌枠サポーター)</h1>
      <div class="stats" id="stats"></div>
      <button class="change-people" id="changePeopleBtn">対象者を変更</button>
    </div>
    <div class="controls">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16" y1="16" x2="21" y2="21"/></svg>
        <input id="search" type="text" placeholder="曲名・アーティスト名で検索">
      </div>
      <div class="status-msg" id="statusMsg"></div>
    </div>
  </header>

  <main>
    <div id="loading">読み込み中…</div>
    <table id="matrixTable" style="display:none">
      <thead><tr id="headerRow"></tr></thead>
      <tbody id="bodyRows"></tbody>
    </table>
    <div class="empty-state" id="emptyState" style="display:none">該当する曲がありません</div>
  </main>
</div>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
