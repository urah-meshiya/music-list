<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0">
  <title>歌える曲リスト</title>
  <link rel="stylesheet" href="./css/custom.css">
  <link rel="icon" href="./img/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Yomogi&display=swap" rel="stylesheet">
</head>

<body>
<div class="topbar">
  <div class="topbar-title">
    <p id="title" style="display: none;"></p>
  </div>
  <div class="topbar-tools">
    <div id="search"></div>
  </div>
</div>

<div id="tabArea">
  <div id="pagingBtn" class="button">ｼﾞｬﾝﾙ切替</div>　
  <div id="openModalBtn" class="button">ﾗﾝﾀﾞﾑ</div>
  <div id="onShootingStar" class="seed" aria-label="ｼﾄﾞﾔﾃﾞｰ"></div>
</div>

<div id="tableContainer">
  <div id="tableSpinner">
    <div class="spinner" aria-label="ﾐﾁｬﾏﾀﾞﾖｰ"></div>
    <p>Now Loading...</p>
  </div>
</div>

<div class="footer">
</div>

<dialog id="randomDialog"></dialog>

<script type="module" src="./js/core.js"></script>
</body>
</html>
