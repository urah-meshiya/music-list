<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>コラボサポーター(仮)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --washi:#f7f3e8;
    --washi-deep:#efe8d6;
    --ink:#2b2924;
    --ink-soft:#6b6558;
    --indigo:#76a5bb;
    --indigo-deep:#3d6273;
    --hanko:#b3392c;
    --hanko-soft:#c8564a;
    --line:#ddd4bc;
    --line-soft:#e8e1cc;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:var(--washi);
    background-image:
      radial-gradient(circle at 20% 10%, rgba(118,165,187,0.08), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(179,57,44,0.05), transparent 45%);
    color:var(--ink);
    font-family:"Zen Kaku Gothic New", sans-serif;
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
  }
 
  /* ---------- 選択画面 ---------- */
  #selectScreen{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .select-card{
    background:#fffdf7;
    border:1px solid var(--line);
    border-radius:18px;
    padding:32px 36px;
    max-width:480px;
    width:100%;
    box-shadow:0 6px 24px rgba(43,41,36,0.08);
  }
  .select-card h1{
    font-family:"Shippori Mincho", serif;
    font-weight:800;
    font-size:22px;
    margin:0 0 4px;
    color:var(--indigo-deep);
  }
  .select-card p.lead{
    margin:0 0 20px;
    font-size:13px;
    color:var(--ink-soft);
  }
  .select-actions{
    display:flex;
    gap:12px;
    font-size:12px;
    margin-bottom:10px;
  }
  .select-actions button{
    background:none;
    border:none;
    color:var(--indigo-deep);
    text-decoration:underline;
    cursor:pointer;
    padding:0;
    font-family:inherit;
    font-size:12px;
  }
  #personList{
    list-style:none;
    margin:0 0 24px;
    padding:0;
    max-height:280px;
    overflow-y:auto;
    border-top:1px solid var(--line-soft);
  }
  #personList li{
    border-bottom:1px solid var(--line-soft);
  }
  #personList label{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 4px;
    cursor:pointer;
    font-size:14px;
  }
  #personList input[type="checkbox"]{
    width:17px; height:17px;
    accent-color:var(--hanko);
    cursor:pointer;
  }
  .go-btn{
    width:100%;
    padding:12px;
    border:none;
    border-radius:999px;
    background:var(--indigo-deep);
    color:#fff;
    font-family:inherit;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    letter-spacing:.04em;
    transition:background .15s;
  }
  .go-btn:hover{background:var(--hanko);}
  .go-btn:disabled{background:var(--line); cursor:not-allowed;}
  .select-empty{
    font-size:13px;
    color:var(--ink-soft);
    padding:16px 0;
  }
 
  /* ---------- メイン画面 ---------- */
  #mainScreen{
    display:none;
    flex-direction:column;
    height:100%;
  }
  header{
    padding:22px 28px 14px;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .title-row{
    display:flex;
    align-items:baseline;
    gap:14px;
    flex-wrap:wrap;
  }
  h1.main-title{
    font-family:"Shippori Mincho", serif;
    font-weight:800;
    font-size:26px;
    margin:0;
    letter-spacing:.04em;
    color:var(--indigo-deep);
  }
  h1.main-title .accent{color:var(--hanko);}
  .stats{
    font-size:13px;
    color:var(--ink-soft);
    font-feature-settings:"tnum";
  }
  .stats b{color:var(--indigo-deep); font-weight:700;}
  .change-people{
    margin-left:auto;
    font-size:12px;
    color:var(--indigo-deep);
    text-decoration:underline;
    cursor:pointer;
    background:none;
    border:none;
    font-family:inherit;
  }
 
  .controls{
    margin-top:12px;
    display:flex;
    gap:10px;
    align-items:center;
  }
  .search-wrap{
    position:relative;
    flex:1;
    max-width:420px;
  }
  .search-wrap input{
    width:100%;
    padding:9px 14px 9px 34px;
    border:1px solid var(--line);
    border-radius:999px;
    background:#fff;
    font-family:inherit;
    font-size:14px;
    color:var(--ink);
    outline:none;
    transition:border-color .15s;
  }
  .search-wrap input:focus{border-color:var(--indigo);}
  .search-wrap svg{
    position:absolute;
    left:12px; top:50%;
    transform:translateY(-50%);
    width:14px; height:14px;
    stroke:var(--ink-soft);
    fill:none;
    stroke-width:2;
  }
  .status-msg{
    font-size:13px;
    color:var(--hanko);
  }
 
  main{
    flex:1;
    overflow:auto;
    padding:0 28px 28px;
  }
 
  #loading{
    padding:60px 0;
    text-align:center;
    color:var(--ink-soft);
    font-size:14px;
  }
 
  table{
    border-collapse:separate;
    border-spacing:0;
    margin-top:16px;
    background:#fff;
    box-shadow:0 1px 0 var(--line);
  }
  th,td{
    border-bottom:1px solid var(--line-soft);
    border-right:1px solid var(--line-soft);
    padding:0;
    white-space:nowrap;
  }
  thead th{
    position:sticky;
    top:0;
    z-index:3;
    background:var(--washi-deep);
    padding:10px 14px;
    font-size:13px;
    font-weight:700;
    color:var(--indigo-deep);
    text-align:center;
    min-width:64px;
  }
  thead th:first-child{
    left:0;
    z-index:4;
    text-align:left;
    background:var(--washi-deep);
  }
  tbody th{
    position:sticky;
    left:0;
    z-index:2;
    background:#fffdf7;
    text-align:left;
    padding:8px 16px;
    min-width:220px;
    max-width:320px;
    white-space:normal;
    word-break:break-word;
  }
  tbody th .song-title{
    display:block;
    font-weight:700;
    font-size:14px;
    color:var(--ink);
  }
  tbody th .song-meta{
    display:block;
    font-size:11px;
    color:var(--ink-soft);
    margin-top:1px;
  }
  tbody th .song-meta .count{
    color:var(--hanko);
    font-weight:700;
  }
  tbody tr:nth-child(even) td, tbody tr:nth-child(even) th{
    background:#faf6ea;
  }
  tbody tr:hover td, tbody tr:hover th{
    background:#f1ecd8 !important;
  }
  td.mark-cell{
    text-align:center;
    padding:6px 0;
  }
 
  .stamp{
    display:inline-block;
    width:24px; height:24px;
    border:2.5px solid var(--hanko);
    border-radius:48% 52% 51% 49% / 53% 47% 53% 47%;
    box-shadow:0 0 0 1px rgba(179,57,44,0.08) inset;
    opacity:.88;
  }
 
  .empty-state{
    padding:60px 20px;
    text-align:center;
    color:var(--ink-soft);
    font-size:14px;
  }

  /* ---------- Remix/アレンジ紐づけ表示 ---------- */
  tbody th .song-title-row{
    display:flex;
    align-items:center;
    gap:2px;
  }
  .variant-toggle{
    flex:0 0 auto;
    width:16px;
    height:16px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-size:9px;
    color:var(--indigo-deep);
    cursor:pointer;
    user-select:none;
    transition:transform .15s;
    transform:rotate(0deg);
  }
  .variant-toggle.open{
    transform:rotate(90deg);
  }
  tbody th.has-variants{
    cursor:pointer;
  }
  tbody th .variant-count{
    color:var(--indigo-deep);
    font-weight:700;
  }
  #bodyRows tr.variant-row th,
  #bodyRows tr.variant-row td{
    background:#f1ecda !important;
  }
  #bodyRows tr.variant-row:hover th,
  #bodyRows tr.variant-row:hover td{
    background:#e9e2c8 !important;
  }
  tr.variant-row th{
    padding-left:34px;
  }
  tr.variant-row .song-title{
    font-size:12.5px;
    font-weight:500;
    color:var(--ink-soft);
  }
  tr.variant-row .variant-label{
    display:inline-block;
    margin-left:7px;
    padding:1px 8px;
    border-radius:999px;
    background:var(--indigo);
    color:#fff;
    font-size:10px;
    font-weight:700;
    letter-spacing:.02em;
    vertical-align:1px;
  }
  tr.variant-row td.mark-cell{
    padding:4px 0;
  }
  tr.variant-row .stamp{
    width:18px; height:18px;
    border-width:2px;
    opacity:.8;
  }
  @media (max-width: 640px){
    tr.variant-row th{
      padding-left:22px;
    }
  }
 
  ::-webkit-scrollbar{height:10px; width:10px;}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:6px;}
  ::-webkit-scrollbar-track{background:transparent;}
 
  /* スマホ幅では曲名列を横方向には固定しない(人の列を見える幅を広くするため) */
  @media (max-width: 640px){
    thead th:first-child{
      left:auto;
      z-index:3;
    }
    thead th{
      min-width:40px;
      padding:8px 6px;
      font-size:12px;
    }
    tbody th{
      position:static;
      min-width:150px;
      max-width:190px;
      padding:6px 10px;
    }
    tbody th .song-title{
      font-size:13px;
    }
    td.mark-cell{
      padding:4px 0;
    }
    .stamp{
      width:16px;
      height:16px;
      border-width:2px;
    }
  }
</style>
</head>
<body>

<!-- ============ 選択画面 ============ -->
<div id="selectScreen">
  <div class="select-card">
    <h1>コラボレーターを選ぶ</h1>
    <p class="lead">表に載せる人だけチェックしてください</p>
    <div class="select-actions">
      <button id="selectAllBtn">すべて選択</button>
      <button id="selectNoneBtn">すべて解除</button>
    </div>
    <ul id="personList"></ul>
    <button class="go-btn" id="goBtn">この人たちで表を作る</button>
  </div>
</div>

<!-- ============ メイン画面 ============ -->
<div id="mainScreen">
  <header>
    <div class="title-row">
      <h1 class="main-title">コラボ<span class="accent">○</span>サポーター</h1>
      <div class="stats" id="stats"></div>
      <button class="change-people" id="changePeopleBtn">対象者を変更</button>
    </div>
    <div class="controls">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16" y1="16" x2="21" y2="21"/></svg>
        <input id="search" type="text" placeholder="曲名・アーティスト名で検索">
      </div>
      <div class="status-msg" id="statusMsg"></div>
    </div>
  </header>

  <main>
    <div id="loading">読み込み中…</div>
    <table id="matrixTable" style="display:none">
      <thead><tr id="headerRow"></tr></thead>
      <tbody id="bodyRows"></tbody>
    </table>
    <div class="empty-state" id="emptyState" style="display:none">該当する曲がありません</div>
  </main>
</div>

<script>

const SPREADSHEETS = [
  // { name: '表示する人名', spreadsheetId: 'スプレッドシートのID', sheetName: 'シート名(タブ名)',
  //   titleColumn: 'A', artistColumn: 'B', headerRow: 1 },
  { name: '柊アオイ', spreadsheetId: '1xfqn2Nq5r5GXLpOPYnSm8BQsm4Rl1rzkzVc226zIqxM', sheetName: 'リスト本体',
    titleColumn: 'D', artistColumn: 'E', headerRow: 4 },
  { name: 'Omame.', spreadsheetId: '1VM287aWQJVFz2ycHikQM0-1Tym--V1WOfOFbpbxPmLw', sheetName: 'list',
    titleColumn: 'D', artistColumn: 'E', headerRow: 2 },
  { name: 'てぃーる', spreadsheetId: '1DcrplaiwuEOXP58lmgDptD8uCu85zzltztLKT4kmFTY', sheetName: 'list',
    titleColumn: 'D', artistColumn: 'E', headerRow: 2 },
  { name: 'SEE:D', spreadsheetId: '10UHIruPvjFVuuvr9UfO8sjk4jLYeiG-56OOWVSStX64', sheetName: 'メインリスト',
    titleColumn: 'B', artistColumn: 'C', headerRow: 2 },
  { name: 'あおは@', spreadsheetId: '1qEAgchkcRZ2Wqxpd0YMfjHbQnqDBYufwK9swauBEae0', sheetName: 'list',
    titleColumn: 'D', artistColumn: 'E', headerRow: 2 },
  { name: '柳屋おばけ', spreadsheetId: '15CVfl5eyirU20CJBmpEKiz_nKEDlnJo3uT32mwk0th0', sheetName: 'ボカロ',
    titleColumn: 'D', artistColumn: 'E', headerRow: 4 },
];

/* 列名(A,B,C...) または数字を 0始まりのインデックスに変換 */
function colToIndex(col) {
  if (col === undefined || col === null || col === '') return null;
  if (/^\d+$/.test(String(col).trim())) return parseInt(col, 10);
  const s = String(col).trim().toUpperCase();
  let idx = 0;
  for (let i = 0; i < s.length; i++) {
    idx = idx * 26 + (s.charCodeAt(i) - 64);
  }
  return idx - 1;
}

/* ------------------------------------------------------------
   SheetService: Googleスプレッドシートをgviz経由でCSV取得
------------------------------------------------------------- */
class SheetService {
  buildUrl(spreadsheetId, sheetName) {
    const base = `https://docs.google.com/spreadsheets/d/${spreadsheetId}/gviz/tq`;
    const params = new URLSearchParams({ tqx: 'out:csv', sheet: sheetName });
    return `${base}?${params.toString()}`;
  }

  async fetchPerson(person) {
    const url = this.buildUrl(person.spreadsheetId, person.sheetName);
    const res = await fetch(url);
    if (!res.ok) {
      throw new Error(`HTTP ${res.status}`);
    }
    const csvText = await res.text();
    const parsed = Papa.parse(csvText, { header: false, skipEmptyLines: true });
    let rows = parsed.data;

    const skipRows = Number.isFinite(person.headerRow) ? person.headerRow : 1;
    if (skipRows > 0) {
      rows = rows.slice(skipRows);
    }

    const titleIdx = colToIndex(person.titleColumn ?? 'A');
    const artistIdx = person.artistColumn !== undefined ? colToIndex(person.artistColumn) : null;

    if (titleIdx === null) {
      throw new Error('titleColumnが指定されていません');
    }

    return rows
      .map(row => ({
        title: (row[titleIdx] || '').trim(),
        artist: artistIdx !== null ? (row[artistIdx] || '').trim() : '',
      }))
      .filter(r => r.title.length > 0);
  }

  async fetchAll(persons) {
    const results = await Promise.allSettled(
      persons.map(p => this.fetchPerson(p))
    );
    const ok = [];
    const errors = [];
    results.forEach((r, i) => {
      if (r.status === 'fulfilled') {
        ok.push({ person: persons[i], rows: r.value });
      } else {
        errors.push({ person: persons[i], error: r.reason });
      }
    });
    return { ok, errors };
  }
}

/* ------------------------------------------------------------
   SongMerger: 曲名+アーティスト名を正規化して同一曲を統合
------------------------------------------------------------- */
class SongMerger {
  normalize(str) {
    return (str || '')
      .normalize('NFKC')
      .trim()
      .toLowerCase()
      // 括弧・感嘆符・疑問符などの記号は全角/半角問わず比較対象から除外する
      .replace(/[!?()\[\]{}「」『』【】〈〉《》～~・,，.。、:：;；'"’”\-‐–—]/g, '')
      .replace(/\s+/g, '');
  }

  /* アーティスト名の類似判定: 完全一致、部分一致(短い方2文字以上が長い方に含まれる)、
     または軽微な表記ゆれ・タイプミス(編集距離)を同一人物とみなす */
  artistMatches(normA, normB) {
    if (normA === normB) return true;
    if (normA === '' || normB === '') return false;

    const shorter = normA.length <= normB.length ? normA : normB;
    const longer = normA.length <= normB.length ? normB : normA;
    if (shorter.length >= 2 && longer.includes(shorter)) return true;

    // 短いタイプミス程度のズレは編集距離で吸収する(短すぎる文字列は誤爆防止のため対象外)
    const minLen = Math.min(normA.length, normB.length);
    if (minLen >= 4) {
      const dist = this.levenshtein(normA, normB);
      const threshold = minLen >= 8 ? 2 : 1;
      if (dist <= threshold) return true;
    }
    return false;
  }

  /* 曲名中に Remix / アレンジ 等の記載があるかを検出し、
     あれば { base: 原曲名らしき部分, label: 表記されていたラベル } を返す。
     なければ null。
     検知したい単語を増やしたい場合は VARIANT_KEYWORDS に追加するだけでOK。 */
  static get VARIANT_KEYWORDS() {
    return [
      'rearranged', 'rearrange', 'arranged', 'arrange',
      'remixed', 'remix',
      'acoustic', 'unplugged',
      'version', 'ver',
      'リアレンジ', 'アレンジ', 'リミックス',
      'アコースティック', 'アンプラグド', 'バージョン',
    ];
  }

  detectVariant(title) {
    if (!title) return null;
    // 英数字のみのキーワードは単語境界(\b)を付けて誤爆を防ぐ(例: 'ver'が'cover'や'forever'の
    // 一部として誤検知されないように)。日本語キーワードは\bが機能しないためそのまま結合する。
    const escape = k => k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const asciiKeywords = SongMerger.VARIANT_KEYWORDS.filter(k => /^[A-Za-z]+$/.test(k));
    const jpKeywords = SongMerger.VARIANT_KEYWORDS.filter(k => !/^[A-Za-z]+$/.test(k));
    const parts = [
      ...asciiKeywords.map(k => `\\b${escape(k)}\\b`),
      ...jpKeywords.map(escape),
    ];
    const KEYWORD = new RegExp(`(${parts.join('|')})`, 'i');

    // 1) 括弧内に記載されているパターン: 「曲名 (〇〇 Remix)」「曲名【アレンジ】」「曲名＜和風アレンジ＞」など
    const bracketRe = /[\(\[【（＜〈]([^\(\)\[\]【】（）＜＞〈〉]*)[\)\]】）＞〉]/g;
    let m;
    while ((m = bracketRe.exec(title)) !== null) {
      if (KEYWORD.test(m[1])) {
        const label = m[1].trim();
        const base = (title.slice(0, m.index) + title.slice(m.index + m[0].length)).trim();
        if (base) return { base, label };
      }
    }

    // 2) 括弧なしで末尾に英字ラベルとして記載されているパターン:
    //    「曲名 Electro Swing Remix」「曲名 -acoustic ver.-」など、
    //    キーワードを含む末尾の英数字の連なりをまるごとラベルとして扱う
    const trimmedTail = title.replace(/[\s\-‐–—―]+$/, '');
    const asciiTailRe = /[\s\-‐–—―]*([A-Za-z0-9][A-Za-z0-9 .,'&+/]*)$/;
    const am = trimmedTail.match(asciiTailRe);
    if (am && KEYWORD.test(am[1])) {
      const label = am[1].trim().replace(/\s+/g, ' ');
      const base = trimmedTail.slice(0, am.index).replace(/[\s\-‐–—―]+$/, '').trim();
      if (base) return { base, label };
    }

    // 3) 括弧なしで末尾に日本語ラベルのみが記載されているパターン
    const jpOnlyKeywords = SongMerger.VARIANT_KEYWORDS.filter(k => /[ぁ-んァ-ヶ一-龠]/.test(k));
    const jpTailRe = new RegExp(`[\\s\\-‐–—―]+(${jpOnlyKeywords.join('|')})[\\s\\-‐–—―]*$`);
    const jm = title.match(jpTailRe);
    if (jm && jm.index > 0) {
      const base = title.slice(0, jm.index).trim();
      if (base) return { base, label: jm[1] };
    }

    return null;
  }

  /* Remix/アレンジのbaseタイトルと原曲候補のnormTitleが「同じ曲」と言えるかどうかを判定。
     アーティスト名の部分一致判定(artistMatches)は文字列长が大きく異なる場合に誤爆するため、
     曲名の同一判定には流用せず、長さが近い場合の軽微な表記ゆれのみ許容する。 */
  titleBaseMatches(normPrimary, normBase) {
    if (!normPrimary || !normBase) return false;
    if (normPrimary === normBase) return true;
    const minLen = Math.min(normPrimary.length, normBase.length);
    const maxLen = Math.max(normPrimary.length, normBase.length);
    if (maxLen - minLen > 2) return false; // 長さが大きく違う場合は別の曲とみなす
    if (minLen < 6) return false; // 短い曲名は誤爆しやすいので完全一致以外は認めない
    const dist = this.levenshtein(normPrimary, normBase);
    return dist <= (minLen >= 10 ? 2 : 1);
  }

  levenshtein(a, b) {
    const m = a.length, n = b.length;
    if (m === 0) return n;
    if (n === 0) return m;
    const dp = new Array(n + 1);
    for (let j = 0; j <= n; j++) dp[j] = j;
    for (let i = 1; i <= m; i++) {
      let prev = dp[0];
      dp[0] = i;
      for (let j = 1; j <= n; j++) {
        const temp = dp[j];
        dp[j] = a[i - 1] === b[j - 1] ? prev : 1 + Math.min(prev, dp[j], dp[j - 1]);
        prev = temp;
      }
    }
    return dp[n];
  }

  merge(personResults) {
    const personNames = personResults.map(pr => pr.person.name);

    // Step1: 全レコードをフラットに展開
    const entries = [];
    personResults.forEach(({ person, rows }) => {
      rows.forEach(({ title, artist }) => {
        entries.push({
          title,
          artist,
          normTitle: this.normalize(title),
          normArtist: this.normalize(artist),
          singer: person.name,
        });
      });
    });

    // Step2: 曲名(完全一致)でグループ化
    const titleGroups = new Map();
    entries.forEach((e, idx) => {
      if (!titleGroups.has(e.normTitle)) titleGroups.set(e.normTitle, []);
      titleGroups.get(e.normTitle).push(idx);
    });

    // Step3: Union-Find でアーティスト部分一致のクラスタを作る(同一曲名グループ内のみ)
    const parent = entries.map((_, i) => i);
    const find = (x) => (parent[x] === x ? x : (parent[x] = find(parent[x])));
    const union = (a, b) => {
      const ra = find(a), rb = find(b);
      if (ra !== rb) parent[ra] = rb;
    };

    titleGroups.forEach((idxList) => {
      for (let i = 0; i < idxList.length; i++) {
        for (let j = i + 1; j < idxList.length; j++) {
          const a = entries[idxList[i]];
          const b = entries[idxList[j]];
          if (this.artistMatches(a.normArtist, b.normArtist)) {
            union(idxList[i], idxList[j]);
          }
        }
      }
    });

    // Step4: クラスタごとに統合(表示アーティスト名は最も短い文字列を採用)
    const clusters = new Map();
    entries.forEach((e, idx) => {
      const root = find(idx);
      if (!clusters.has(root)) clusters.set(root, []);
      clusters.get(root).push(e);
    });

    const clusteredSongs = Array.from(clusters.values()).map(group => {
      const title = group[0].title;
      let displayArtist = group[0].artist;
      group.forEach(e => {
        if (e.artist && (!displayArtist || e.artist.length < displayArtist.length)) {
          displayArtist = e.artist;
        }
      });
      const singers = new Set(group.map(e => e.singer));
      return { title, artist: displayArtist, singers, normTitle: group[0].normTitle, variants: [] };
    });

    // Step5: Remix/アレンジ表記の曲を検出し、原曲(表記なしの曲)へ紐づける
    clusteredSongs.forEach(song => {
      song.variantInfo = this.detectVariant(song.title);
    });

    const primaries = clusteredSongs.filter(s => !s.variantInfo);
    const songs = [];

    clusteredSongs.forEach(song => {
      if (!song.variantInfo) {
        songs.push(song);
        return;
      }
      const normBase = this.normalize(song.variantInfo.base);
      let parent = primaries.find(p => p !== song && p.normTitle === normBase);
      if (!parent) {
        parent = primaries.find(p => p !== song && this.titleBaseMatches(p.normTitle, normBase));
      }
      song.label = song.variantInfo.label;
      if (parent) {
        song.parentTitle = parent.title;
        parent.variants.push(song);
      } else {
        // 紐づけ先が見つからない場合は単独の曲として一覧に残す
        songs.push(song);
      }
    });

    const sortSongs = (list) => list.sort((a, b) => {
      const countCmp = b.singers.size - a.singers.size;
      if (countCmp !== 0) return countCmp;
      const artistCmp = (a.artist || '').localeCompare(b.artist || '', 'ja');
      if (artistCmp !== 0) return artistCmp;
      return (a.title || '').localeCompare(b.title || '', 'ja');
    });

    sortSongs(songs);
    songs.forEach(song => {
      if (song.variants.length > 0) sortSongs(song.variants);
    });

    return { songs, personNames };
  }
}

/* ------------------------------------------------------------
   TableView: マトリクス表の描画
------------------------------------------------------------- */
class TableView {
  constructor({ headerRowEl, bodyRowsEl, tableEl, emptyStateEl }) {
    this.headerRowEl = headerRowEl;
    this.bodyRowsEl = bodyRowsEl;
    this.tableEl = tableEl;
    this.emptyStateEl = emptyStateEl;
    this.data = null;
    this.filterText = '';
  }

  setData(data) {
    this.data = data;
    this.renderHeader();
    this.renderBody();
  }

  renderHeader() {
    const { personNames } = this.data;
    this.headerRowEl.innerHTML = '';
    const corner = document.createElement('th');
    corner.textContent = '曲名';
    this.headerRowEl.appendChild(corner);
    personNames.forEach(name => {
      const th = document.createElement('th');
      th.textContent = name;
      this.headerRowEl.appendChild(th);
    });
  }

  matches(song) {
    if (!this.filterText) return true;
    const n = s => (s || '').normalize('NFKC').toLowerCase();
    const q = n(this.filterText);
    const selfMatch = n(song.title).includes(q) || n(song.artist).includes(q);
    if (selfMatch) return true;
    if (song.variants && song.variants.length > 0) {
      return song.variants.some(v => n(v.title).includes(q) || n(v.artist).includes(q));
    }
    return false;
  }

  renderBody() {
    const { songs, personNames } = this.data;
    const visible = songs.filter(s => this.matches(s));
    this.bodyRowsEl.innerHTML = '';

    if (visible.length === 0) {
      this.tableEl.style.display = 'none';
      this.emptyStateEl.style.display = 'block';
      return;
    }
    this.tableEl.style.display = '';
    this.emptyStateEl.style.display = 'none';

    const isFiltering = !!this.filterText;

    const buildStampCells = (tr, entrySong, rowIdx) => {
      personNames.forEach((name, colIdx) => {
        const td = document.createElement('td');
        td.className = 'mark-cell';
        if (entrySong.singers.has(name)) {
          const stamp = document.createElement('span');
          stamp.className = 'stamp';
          const wobble = ((rowIdx * 7 + colIdx * 13) % 9) - 4;
          stamp.style.transform = `rotate(${wobble}deg)`;
          td.appendChild(stamp);
        }
        tr.appendChild(td);
      });
    };

    visible.forEach((song, rowIdx) => {
      const hasVariants = song.variants && song.variants.length > 0;
      const tr = document.createElement('tr');
      tr.className = 'song-row';

      const th = document.createElement('th');
      if (hasVariants) th.classList.add('has-variants');

      const titleRow = document.createElement('span');
      titleRow.className = 'song-title-row';

      let toggleEl = null;
      if (hasVariants) {
        toggleEl = document.createElement('span');
        toggleEl.className = 'variant-toggle';
        toggleEl.textContent = '▶';
        toggleEl.setAttribute('aria-expanded', isFiltering ? 'true' : 'false');
        if (isFiltering) toggleEl.classList.add('open');
        titleRow.appendChild(toggleEl);
      }

      const titleEl = document.createElement('span');
      titleEl.className = 'song-title';
      titleEl.textContent = song.title;
      titleRow.appendChild(titleEl);
      th.appendChild(titleRow);

      const metaEl = document.createElement('span');
      metaEl.className = 'song-meta';
      const variantNote = hasVariants
        ? ` <span class="variant-count">・関連${song.variants.length}件</span>`
        : '';
      metaEl.innerHTML = `${song.artist ? song.artist + ' / ' : ''}<span class="count">${song.singers.size}人</span>${variantNote}`;
      th.appendChild(metaEl);
      tr.appendChild(th);

      buildStampCells(tr, song, rowIdx);
      this.bodyRowsEl.appendChild(tr);

      if (hasVariants) {
        const variantRows = [];
        song.variants.forEach((variant, vIdx) => {
          const vtr = document.createElement('tr');
          vtr.className = 'variant-row';
          vtr.style.display = isFiltering ? '' : 'none';

          const vth = document.createElement('th');
          const vTitleEl = document.createElement('span');
          vTitleEl.className = 'song-title';
          vTitleEl.textContent = variant.title;
          const vLabelEl = document.createElement('span');
          vLabelEl.className = 'variant-label';
          vLabelEl.textContent = variant.label || 'Remix/アレンジ';
          vth.appendChild(vTitleEl);
          vth.appendChild(vLabelEl);

          const vMetaEl = document.createElement('span');
          vMetaEl.className = 'song-meta';
          vMetaEl.innerHTML = `${variant.artist ? variant.artist + ' / ' : ''}<span class="count">${variant.singers.size}人</span>`;
          vth.appendChild(document.createElement('br'));
          vth.appendChild(vMetaEl);

          vtr.appendChild(vth);
          buildStampCells(vtr, variant, rowIdx * 100 + vIdx + 1);
          this.bodyRowsEl.appendChild(vtr);
          variantRows.push(vtr);
        });

        const toggle = () => {
          const open = toggleEl.classList.toggle('open');
          toggleEl.setAttribute('aria-expanded', String(open));
          variantRows.forEach(r => { r.style.display = open ? '' : 'none'; });
        };
        toggleEl.addEventListener('click', (e) => {
          e.stopPropagation();
          toggle();
        });
        th.addEventListener('click', toggle);
      }
    });
  }

  setFilter(text) {
    this.filterText = text;
    this.renderBody();
  }

  visibleCount() {
    if (!this.data) return 0;
    return this.data.songs.filter(s => this.matches(s)).length;
  }
}

/* ------------------------------------------------------------
   PersonSelector: 最初の人選択画面
------------------------------------------------------------- */
class PersonSelector {
  constructor({ listEl, selectAllBtn, selectNoneBtn, goBtn, screenEl }) {
    this.listEl = listEl;
    this.selectAllBtn = selectAllBtn;
    this.selectNoneBtn = selectNoneBtn;
    this.goBtn = goBtn;
    this.screenEl = screenEl;
    this.onConfirm = null;
  }

  render(persons) {
    this.listEl.innerHTML = '';

    if (persons.length === 0) {
      this.listEl.innerHTML = '<li class="select-empty">SPREADSHEETSに人が登録されていません</li>';
      this.goBtn.disabled = true;
      return;
    }

    persons.forEach((person, i) => {
      const li = document.createElement('li');
      const label = document.createElement('label');
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.value = i;
      checkbox.checked = true;
      const span = document.createElement('span');
      span.textContent = person.name;
      label.appendChild(checkbox);
      label.appendChild(span);
      li.appendChild(label);
      this.listEl.appendChild(li);
    });

    this.selectAllBtn.onclick = () => this.setAll(true);
    this.selectNoneBtn.onclick = () => this.setAll(false);
    this.goBtn.onclick = () => this.confirm();
  }

  setAll(checked) {
    this.listEl.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = checked);
  }

  getSelectedIndices() {
    return Array.from(this.listEl.querySelectorAll('input[type="checkbox"]:checked'))
      .map(cb => parseInt(cb.value, 10));
  }

  confirm() {
    const indices = this.getSelectedIndices();
    if (indices.length === 0) {
      alert('少なくとも1人選択してください');
      return;
    }
    if (this.onConfirm) this.onConfirm(indices);
  }

  show() { this.screenEl.style.display = 'flex'; }
  hide() { this.screenEl.style.display = 'none'; }
}

/* ------------------------------------------------------------
   App: 全体の初期化と結線
------------------------------------------------------------- */
class App {
  constructor() {
    this.sheetService = new SheetService();
    this.merger = new SongMerger();
    this.view = new TableView({
      headerRowEl: document.getElementById('headerRow'),
      bodyRowsEl: document.getElementById('bodyRows'),
      tableEl: document.getElementById('matrixTable'),
      emptyStateEl: document.getElementById('emptyState'),
    });
    this.selector = new PersonSelector({
      listEl: document.getElementById('personList'),
      selectAllBtn: document.getElementById('selectAllBtn'),
      selectNoneBtn: document.getElementById('selectNoneBtn'),
      goBtn: document.getElementById('goBtn'),
      screenEl: document.getElementById('selectScreen'),
    });

    this.selectScreenEl = document.getElementById('selectScreen');
    this.mainScreenEl = document.getElementById('mainScreen');
    this.loadingEl = document.getElementById('loading');
    this.statsEl = document.getElementById('stats');
    this.statusMsgEl = document.getElementById('statusMsg');
    this.searchEl = document.getElementById('search');
    this.changePeopleBtn = document.getElementById('changePeopleBtn');
  }

  init() {
    this.selector.render(SPREADSHEETS);
    this.selector.onConfirm = (indices) => this.loadPeople(indices);
    this.selectScreenEl.style.display = 'flex';

    this.changePeopleBtn.addEventListener('click', () => {
      this.mainScreenEl.style.display = 'none';
      this.selectScreenEl.style.display = 'flex';
    });
  }

  async loadPeople(indices) {
    const selectedPersons = indices.map(i => SPREADSHEETS[i]);

    this.selectScreenEl.style.display = 'none';
    this.mainScreenEl.style.display = 'flex';
    this.loadingEl.style.display = 'block';
    document.getElementById('matrixTable').style.display = 'none';
    document.getElementById('emptyState').style.display = 'none';
    this.statusMsgEl.textContent = '';
    this.loadingEl.textContent = '読み込み中…';

    const { ok, errors } = await this.sheetService.fetchAll(selectedPersons);

    if (errors.length > 0) {
      const names = errors.map(e => e.person.name).join('、');
      this.statusMsgEl.textContent = `⚠ 読み込み失敗: ${names}(公開設定・IDを確認してください)`;
    }

    if (ok.length === 0) {
      this.loadingEl.textContent = 'スプレッドシートを読み込めませんでした。設定を確認してください。';
      return;
    }

    const merged = this.merger.merge(ok);
    this.view.setData(merged);
    this.loadingEl.style.display = 'none';
    this.updateStats(merged);

    this.searchEl.value = '';
    this.searchEl.oninput = () => {
      this.view.setFilter(this.searchEl.value);
      this.updateStats(merged);
    };
  }

  updateStats(merged) {
    const total = merged.songs.length;
    const visible = this.view.visibleCount();
    const peopleCount = merged.personNames.length;
    this.statsEl.innerHTML = `<b>${peopleCount}</b>人 / 曲数 <b>${visible}</b>${visible !== total ? ` (全${total})` : ''}`;
  }
}

document.addEventListener('DOMContentLoaded', () => {
  new App().init();
});
</script>
